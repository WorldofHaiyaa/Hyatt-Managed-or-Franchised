@media (max-width: 600px) {

.popup a { text-decoration: none; }

.topbar {

  left: 50%;
  transform: translateX(-50%);
  z-index: 10020;
  display: flex;

  background: rgba(20,20,20,.85);

  color: #eee;

  border-radius: 6px;
  padding: 6px 10px;
  outline: none;
}
.topbar button {

}
.topbar button:hover { background:#2a2a2a; }

.legend {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,.95);
  color: #eee;
  padding: 10px 12px;

}
.legend .row { display:flex; align-items:center; margin: 4px 0; white-space: nowrap; }
.legend .swatch { width:14px; height:14px; border-radius: 50%; margin-right:8px; box-sizing: border-box; }
.legend .swatch.deep { background: rgb(75,119,169); }
.legend .swatch.light { background: rgb(173,216,230); }

</style>

const map = L.map('map');
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
const bounds = L.latLngBounds();
const group = L.layerGroup().addTo(map);

// Add property markers
data.forEach(p => {
  const deepBlue = "rgb(75,119,169)";
  const lightBlue = "rgb(173,216,230)";
  const purple = "rgb(128,0,128)";
  let fillColor = (p.managed === 1) ? deepBlue : lightBlue;
  if (p.ownership_has) fillColor = purple;
  const marker = L.circleMarker([p.lat, p.lon], {
    radius: 6,
    color: fillColor,
    opacity: 1.0,
    weight: 0,
    fillColor: fillColor,
    fillOpacity: 1.0
  });
  const safeURL = p.url && typeof p.url === 'string' ? p.url : '';
  const link = safeURL ? `<a href="${safeURL}" target="_blank" rel="noopener">Open website</a>` : '(no URL)';
  marker.bindPopup(`<div class="popup"><strong>${p.name || 'Unknown'}</strong><br/>${link}</div>`);
  marker.addTo(group);
  bounds.extend([p.lat, p.lon]);
});
if (bounds.isValid()) { map.fitBounds(bounds.pad(0.1)); } else { map.setView([0,0], 2); }

// Keep only latest search marker (also used for user location)
let searchMarker = null;
const yellowIcon = L.divIcon({
  className: 'custom-x',
  html: '<div style="color:#ffd54f;font-weight:bold;font-size:16px;">×</div>',
  iconSize: [16, 16],
  iconAnchor: [8, 8]
});

function showSingleYellow(lat, lon) {
  if (searchMarker) map.removeLayer(searchMarker);
  searchMarker = L.marker([lat, lon], { icon: yellowIcon }).addTo(map);
}

function useMyLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    showSingleYellow(lat, lon);
    map.setView([lat, lon], 11);
  });
}

async function geocodeAndGo(q) {
  if (!q) return;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q);
    const res = await fetch(url, {headers: {'Accept': 'application/json'}});
    const arr = await res.json();
    if (arr && arr.length) {
      const lat = parseFloat(arr[0].lat), lon = parseFloat(arr[0].lon);
      showSingleYellow(lat, lon);
      map.setView([lat, lon], 12);
    }
  } catch(e) { /* ignore */ }
}

document.getElementById('useLocBtn').addEventListener('click', useMyLocation);
document.getElementById('searchBtn').addEventListener('click', () => geocodeAndGo(document.getElementById('addrInput').value));
document.getElementById('addrInput').addEventListener('keydown', (e) => { if (e.key==='Enter') geocodeAndGo(e.target.value); });
</script>
